server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: ct286-invoicing-api
  datasource:
    url: '${DB_URL:jdbc:sqlserver://localhost\SQLEXPRESS;databaseName=CT286_Invoicing;encrypt=true;trustServerCertificate=true}'
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  invoice:
    seller:
      name: ${INVOICE_SELLER_NAME:CT286 Invoicing}
      vat: ${INVOICE_SELLER_VAT:}
      address: ${INVOICE_SELLER_ADDRESS:}
